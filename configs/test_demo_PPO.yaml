
run:
  seed: 0
  output_dir: Null

wandb:
  entity: Null
  project: Null
  tags: Null

env:
  id: "HighwayEgo-v0"
  n_envs: 4
  kwargs:
    ego: "continuous"
    reward: "fast"

agent:
  kwargs:
    policy: "MlpPolicy"
    n_steps: 1000
    n_epochs: 10
    learning_rate: 0.0003
    batch_size: 64
    ent_coef: 0
    gae_lambda: 0.95
    gamma: 0.997
    policy_kwargs:
      net_arch: [64, 64]
    device: "cpu"

algo:
  kwargs:
    lr_rew: 0.001
    gradient_steps_rew: 100
    batch_size_expert: 32
    batch_size_model: 64
    l2_rew: 0.01
    fragment_length: 100
    temperature: 1.0
    initial_queries: 1
    initial_agent_timesteps: 20000
    exploration_frac: 0.0
    exploration_eps: 0.5
    query_schedule: "constant"
    model_buffer_size: 1000
    n_anchor_iterations: 10
    anchor_frac: 0.4
    # Reward model freeze (set freeze_patience > 0 to enable).
    # The model is frozen (restored to best weights) when Kendall τ drops
    # below freeze_threshold_low for freeze_patience consecutive iterations.
    # It unfreezes if Kendall τ recovers above freeze_threshold_high.
    freeze_threshold_low: 0.5
    freeze_threshold_high: 0.8
    freeze_patience: 3
    reward_model_kwargs:
      n_ensembles: 3
      net_arch: [32, 32]
      activation_fn: tanh
      alfa: 1

train:
  kwargs:
    total_timesteps: 2000000
    total_queries: 10000
    timesteps_per_iteration: 20000
    checkpoint_interval: 10

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null

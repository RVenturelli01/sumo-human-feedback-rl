# PPO baseline trained directly on the environment's TRUE reward (no reward model).

run:
  seeds: [0, 1, 2]
  output_dir: "outputs"

wandb:
  entity: "andrea02polimi-politecnico-di-milano"
  project: "preference+demonstration"
  tags: Null

env:
  id: "HighwayEgo-v0"
  n_envs: 4
  kwargs:
    ego: "continuous"
    reward: "fast"

agent:
  kwargs:
    policy: "MlpPolicy"
    n_steps: 1000
    n_epochs: 10
    learning_rate: 0.0003
    batch_size: 64
    ent_coef: 0
    gae_lambda: 0.95
    gamma: 0.997
    policy_kwargs:
      net_arch: [64, 64]
    device: "cpu"

eval:
  n_episodes: 20
  seed: 1000

train:
  kwargs:
    total_timesteps: 2000000
    log_interval: 1

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null

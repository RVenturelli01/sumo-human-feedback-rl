run:
  # Path to the training run directory (relative to project root output/)
  dir: "output/christiano/2026-03-18_10-13-21"

agent:
  # Path to the policy checkpoint (relative to project root)
  model: "output/christiano/2026-03-18_10-13-21/models/policy_christiano"

eval:
  episodes: null          # null = run forever until Ctrl+C

play:
  step_delay: 0.05         # seconds between steps (0 = as fast as possible)
  interactive: false      # true = press Enter before each step

hydra:
  run:
    dir: /tmp/hydra_play/${now:%Y-%m-%d_%H-%M-%S}
  output_subdir: null

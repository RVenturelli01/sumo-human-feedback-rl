name: SAC

algo: "SAC"
kwargs:
  policy: "MlpPolicy"
  learning_rate: 3e-4
  buffer_size: 20000
  learning_starts: 5000
  batch_size: 256
  tau: 0.005
  gamma: 0.99
  # train_freq and gradient_steps below are set to satisfy SB3 constructor
  # requirements but are NOT used by ChristianoSACAlgorithm's outer loop,
  # which controls collection and updates directly.
  train_freq: 1
  gradient_steps: 1
  ent_coef: "auto"
  target_update_interval: 1
  use_sde: false
  stats_window_size: 100
  policy_kwargs:
    net_arch: [256, 256]
  seed: ${run.seed}
  device: "cpu"
  tensorboard_log: ${hydra:runtime.cwd}/tensorboard
  verbose: 1
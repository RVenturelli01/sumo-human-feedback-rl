name: christiano_ppo

# ── RL policy (SB3 PPO) ───────────────────────────────────────────────────
agent:
  algo: PPO
  kwargs:
    policy: MlpPolicy
    learning_rate: 3.0e-4
    n_steps: 2048           # rollout buffer size per env; must match n_rollout_steps
    batch_size: 64
    n_epochs: 10            # gradient epochs per PPO update
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.0
    vf_coef: 0.5
    max_grad_norm: 0.5
    verbose: 0

# ── ChristianoPPOAlgorithm constructor arguments ──────────────────────────
kwargs:
  # Reward model
  reward_model_n_networks: 3
  reward_model_hidden_size: 256
  reward_model_lr: 3.0e-4
  reward_model_l2: 1.0e-4
  # Preferences / segments
  segment_length: 50
  preference_dataset_max_size: 3000
  query_schedule: constant    # "constant" | "inverse"
  # Compute
  device: cpu

# ── ChristianoPPOAlgorithm.train() arguments ─────────────────────────────
train:
  kwargs:
    total_timesteps: 1_000_000
    # Pre-training phase
    n_initial_queries: 200
    # Main loop
    n_rollout_steps: 2048         # steps per env per iteration (match agent.kwargs.n_steps)
    n_queries_per_iter: 10
    reward_model_train_steps: 200
    reward_model_batch_size: 64
    # Note: n_policy_train_steps is NOT a parameter for PPO.
    # The number of gradient steps is controlled by agent.kwargs.n_epochs.

name: christiano


kwargs:
  n_ensembles: 5
  segment_length: 20
  device: cpu
  lr_reward_model: 1e-4
  max_dataset_size: 1e10
  # reward trainer parameters
  reward_model_batch_size: 32
  reward_training_epochs: 10
  # rollout parameters
  num_pairs_initial: 40
  num_pairs_final: 0
  decay_pairs_schedule: 10.0


train:
  kwargs:
    # training general parameters
    num_iterations: 20
    # agent learning parameters
    total_timesteps: 1e5


agent:
  algo: "DQN"
  kwargs:
    policy: MlpPolicy
    learning_rate: 0.0001
    buffer_size: 500000
    learning_starts: 10000
    batch_size: 512
    tau: 1.0
    gamma: 0.99
    train_freq: 4
    gradient_steps: 8
    replay_buffer_class: null
    replay_buffer_kwargs: null
    optimize_memory_usage: false
    n_steps: 1
    target_update_interval: 1000
    exploration_fraction: 0.3
    exploration_initial_eps: 0.5
    exploration_final_eps: 0.05
    max_grad_norm: 10
    stats_window_size: 100
    policy_kwargs:
      net_arch: [128, 128]
    verbose: 1
    seed: ${run.seed}
    device: "cpu"
    tensorboard_log: ${hydra:run.dir}/tensorboard



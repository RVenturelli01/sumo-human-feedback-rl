name: christiano

# ── RL policy (SB3 algorithm used as the learning agent) ──────────────────
agent:
  algo: SAC
  kwargs:
    policy: MlpPolicy
    learning_rate: 3.0e-4
    buffer_size: 100_000
    batch_size: 256
    tau: 0.005
    gamma: 0.99
    verbose: 0

# ── ChristianoAlgorithm constructor arguments ─────────────────────────────
kwargs:
  # Reward model
  reward_model_n_networks: 3
  reward_model_hidden_size: 256
  reward_model_lr: 3.0e-4
  reward_model_l2: 1.0e-4
  # Preferences / segments
  segment_length: 50
  preference_dataset_max_size: 3000
  query_schedule: constant    # "constant" | "inverse"
  # Compute
  device: cpu

# ── ChristianoAlgorithm.train() arguments ────────────────────────────────
train:
  kwargs:
    total_timesteps: 1_000_000
    # Pre-training phase: number of synthetic preferences for initial reward model training
    n_initial_queries: 200
    # Main loop
    n_rollout_steps: 2000         # steps per env per iteration
    n_queries_per_iter: 10        # preference queries per iteration
    reward_model_train_steps: 200 # gradient steps on reward model per iteration
    reward_model_batch_size: 64
    n_policy_train_steps: 1000    # gradient steps on policy per iteration
    log_interval: 1
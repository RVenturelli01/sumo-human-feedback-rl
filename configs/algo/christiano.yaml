name: christiano


kwargs:
  device: cpu
  # rollout parameters
  segment_length: 20
  num_pairs_initial: 100
  num_pairs_final: 10
  decay_pairs_schedule: 5.0
  # reward model and trainer parameters
  reward_model_batch_size: 64
  lr_reward_model: 0.0003
  max_dataset_size: 5000
  n_ensembles: 5


train:
  kwargs:
    # rollout parameters
    segments_oversample_factor: 3
    # training general parameters
    pretrain_iterations: 3
    total_iterations: 10
    # agent learning parameters
    agent_timesteps_per_it: 500000
    agent_log_interval: 1   # how many rollouts between logging agent training progress
    # reward model training parameters
    reward_model_epochs_per_it: 10


agent:
  algo: "PPO"
  kwargs:
    policy: "MlpPolicy"
    learning_rate: 3e-4
    n_steps: 256
    batch_size: 256
    n_epochs: 5
    gamma: 0.995
    gae_lambda: 0.95
    clip_range: 0.2
    clip_range_vf: null
    normalize_advantage: true
    ent_coef: 0.03
    vf_coef: 0.8
    max_grad_norm: 0.5
    use_sde: false
    sde_sample_freq: -1
    rollout_buffer_class: null
    rollout_buffer_kwargs: {}
    target_kl: null
    stats_window_size: 100
    policy_kwargs:
      net_arch: [256, 128]
    seed: ${run.seed}
    device: "cpu"
    tensorboard_log: ${hydra:runtime.cwd}/tensorboard
    verbose: 1


name: christiano-ppo


kwargs:
  device: cpu
  # rollout parameters
  segment_length: 30
  num_pairs_initial: 250
  num_pairs_final: 100
  decay_pairs_schedule: 3
  # reward model and trainer parameters
  reward_model_batch_size: 64
  lr_reward_model: 1e-4
  max_dataset_size: 50000
  n_ensembles: 4


train:
  kwargs:
    # rollout parameters
    segments_oversample_factor: 2
    # training general parameters
    pretrain_iterations: 5
    total_timesteps: 1000000
    agent_log_interval: 1
    # reward model training parameters
    reward_model_epochs_per_it: 7


agent:
  algo: "PPO"
  kwargs:
    policy: "MlpPolicy"
    learning_rate: 3e-4
    n_steps: 2048
    batch_size: 64
    n_epochs: 10
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    clip_range_vf: null
    normalize_advantage: true
    ent_coef: 0.0
    vf_coef: 0.5
    max_grad_norm: 0.5
    use_sde: false
    sde_sample_freq: -1
    rollout_buffer_class: null
    rollout_buffer_kwargs: {}
    target_kl: null
    stats_window_size: 100
    policy_kwargs:
      net_arch: [256, 128]
    seed: ${run.seed}
    device: "cpu"
    tensorboard_log: ${hydra:runtime.cwd}/tensorboard
    verbose: 1
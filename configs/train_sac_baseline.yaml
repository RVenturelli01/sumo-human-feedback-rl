# SAC baseline trained directly on the environment's TRUE reward (no reward model).

run:
  # Each run trains one agent per seed and the sweeps optimise the across-seed
  # mean of the final deterministic eval, so a lucky single seed can't win a trial.
  seeds: [0, 1, 2]
  # Must be a real path: sweep agents don't pass it, so a Null default would make
  # every trial crash in make_run_dir.
  output_dir: "outputs"

wandb:
  entity: "andrea02polimi-politecnico-di-milano"
  project: "preference+demonstration"
  tags: Null

env:
  id: "HighwayEgo-v0"
  # SAC is off-policy so multiple envs don't help as much; 1 is standard.
  n_envs: 1
  kwargs:
    ego: "continuous"
    reward: "fast"

agent:
  kwargs:
    policy: "MlpPolicy"
    buffer_size: 300000
    learning_starts: 2000
    batch_size: 256
    learning_rate: 0.000124298330
    gamma: 0.997
    tau: 0.00311
    ent_coef: "auto"
    train_freq: 8
    gradient_steps: 8
    policy_kwargs:
      net_arch: [64, 64]
    device: "cpu"

eval:
  # Deterministic evaluation on a fresh env, run once at the end of training
  # (libsumo holds a single global SUMO instance, so a second env can't be opened
  # mid-training). The live sweep metric is agent/rewards/ep_fast_return, logged
  # during training by CustomLoggingCallback.
  n_episodes: 20
  seed: 1000         # distinct from training seed to avoid evaluating on train scenarios

train:
  # Same optional fixed-grid agent logging used by DemoAlgorithm.
  # null = SB3's native episode-based dumps.
  agent_log_timestep_interval: null
  kwargs:
    total_timesteps: 2000000
    log_interval: 100    # SB3 logs every `log_interval` episodes

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null


run:
  seed: 0
  output_dir: Null

wandb:
  entity: Null
  project: Null
  tags: Null

env:
  id: "HighwayEgo-v0"
  # SAC is off-policy so multiple envs don't help as much; 1 is standard.
  n_envs: 1
  kwargs:
    ego: "continuous"
    reward: "fast"

agent:
  kwargs:
    policy: "MlpPolicy"
    # Keep buffer small relative to total run so stale rewards from old reward
    # models don't dominate training. With timesteps_per_iteration=10000 this
    # gives ~10 iterations of history.
    buffer_size: 100000
    # DemoAlgorithm first bootstraps the reward on a separate rollout, then uses
    # these timesteps to warm up SAC on an already-trained reward model.
    learning_starts: 2000
    batch_size: 256
    learning_rate: 0.0003
    gamma: 0.997
    tau: 0.005
    ent_coef: "auto"
    train_freq: 1
    gradient_steps: 1
    policy_kwargs:
      net_arch: [64, 64]
    device: "cpu"

algo:
  kwargs:
    # Historical: maxent, maxent_2, demo (or demo_loss).
    # Corrected: maxent_corrected, demo_corrected.
    loss_type: maxent
    # Keep the diagnostic replay buffer in both cases. False makes SAC consume
    # stored rewards while still logging their mismatch with current predictions.
    relabel_rewards: true
    # Fit mean/std on each current rollout. The transform is applied only to
    # rewards consumed by SAC; the IRL loss continues to use raw rewards.
    normalize_agent_reward: true
    lr_rew: 0.001
    gradient_steps_rew: 100
    batch_size_expert: 32
    batch_size_model: 64
    l2_rew: 0.01
    temperature: 1.0
    # Only used by maxent_corrected. null = whole-trajectory partition (historical).
    # Short fragments (e.g. 10-30) shrink the variance of log q over long horizons
    # and keep the importance-sampling effective sample size from collapsing to 1.
    fragment_length: null
    initial_agent_timesteps: 10000
    exploration_frac: 0.0
    exploration_eps: 0.5
    reward_model_kwargs:
      n_ensembles: 3
      net_arch: [32, 32]
      activation_fn: tanh
      alpha: 1

train:
  kwargs:
    total_timesteps: 2000000
    timesteps_per_iteration: 10000
    # How often (in agent episodes) SB3 logs during agent training.
    log_interval: 100
    checkpoint_interval: 10
    # Set to 0 to disable the state-action occupancy AUC diagnostic.
    imitation_diagnostics_interval: 10

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null

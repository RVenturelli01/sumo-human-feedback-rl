
run:
  seed: 0
  output_dir: Null

wandb:
  entity: Null
  project: Null
  tags: Null

env:
  id: "HighwayEgo-v0"
  # SAC is off-policy so multiple envs don't help as much; 1 is standard.
  n_envs: 1
  kwargs:
    ego: "continuous"
    reward: "fast"

agent:
  kwargs:
    policy: "MlpPolicy"
    # Keep buffer small relative to total run so stale rewards from old reward
    # models don't dominate training. With timesteps_per_iteration=10000 this
    # gives ~10 iterations of history.
    buffer_size: 100000
    # Collect enough data before the first gradient update so the reward model
    # has already run at least one iteration when SAC starts updating.
    learning_starts: 2000
    batch_size: 256
    learning_rate: 0.0003
    gamma: 0.997
    tau: 0.005
    ent_coef: "auto"
    train_freq: 1
    gradient_steps: 1
    policy_kwargs:
      net_arch: [64, 64]
    device: "cpu"

algo:
  kwargs:
    # Reward loss: one of "maxent", "maxent_2", "demo".
    loss_type: maxent
    lr_rew: 0.001
    gradient_steps_rew: 100
    batch_size_expert: 32
    batch_size_model: 64
    l2_rew: 0.01
    temperature: 1.0
    initial_agent_timesteps: 10000
    exploration_frac: 0.0
    exploration_eps: 0.5
    reward_model_kwargs:
      n_ensembles: 3
      net_arch: [32, 32]
      activation_fn: tanh
      alpha: 1

train:
  kwargs:
    total_timesteps: 2000000
    timesteps_per_iteration: 10000
    # How often (in agent episodes) SB3 logs during agent training.
    log_interval: 100
    checkpoint_interval: 10

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null

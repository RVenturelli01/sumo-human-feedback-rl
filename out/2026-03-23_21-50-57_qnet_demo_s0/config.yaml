seed: 0
env:
  expert_model: sumo-rl-ego/models
  n_envs: 4
resources:
  device: cpu
  torch_num_threads: 2
reward_predictor:
  lr: 0.0002
  n_preds: 3
  val_interval: 50
  demo_weight: 0.5
  demo_margin: 1.0
policy:
  lr: 0.0007
  gamma: 0.99
  rollout_steps: 64
  entropy_coef: 0.01
  value_coef: 0.5
  max_gradient_norm: 0.5
training:
  reward_predictor_reload_interval: 50
  rp_retrain_min_new_prefs: 50
  policy_save_interval: 100
  total_env_steps: 1000000
preferences:
  oracle: qnet
  label_mode: hard
  oracle_temperature: 1.0
  use_demonstrations: true
  use_demo_preferences: false
  initial_prefs: 2000
  segment_len: 25
  max_segs: 1000
  db_train_maxlen: 3000
  db_val_maxlen: 750
  seg_pipe_maxsize: 100
  demo_seg_pipe_maxsize: 100
  demo_db_maxlen: 1500
  disagreement_candidates: 20
  max_query_interval: 0.0

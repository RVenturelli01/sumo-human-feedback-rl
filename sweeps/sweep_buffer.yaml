# Stage 2 — Buffer / update schedule (30-50 trials).
# Fill in the best Core RL values found in Stage 1 in the `# BEST FROM STAGE 1`
# block below before launching.
#
#   wandb sweep sweeps/sweep_buffer.yaml
#   wandb agent <entity>/<project>/<sweep_id>

program: scripts/train_sac_baseline.py
method: bayes
# Stop the sweep automatically after this many trials (across all agents).
run_cap: 40
metric:
  name: sweep/mean_fast_return
  goal: maximize

command:
  - python
  - ${program}
  - ${args_no_hyphens}

parameters:
  # --- swept this stage ---
  agent.kwargs.buffer_size:
    values: [50000, 100000, 300000, 1000000]
  agent.kwargs.learning_starts:
    values: [1000, 2000, 5000, 10000]
  agent.kwargs.train_freq:
    values: [1, 4, 8]
  agent.kwargs.gradient_steps:
    values: [1, 4, 8, -1]   # -1 = one gradient step per env step collected

  # --- BEST FROM STAGE 1 (edit these) ---
  agent.kwargs.learning_rate:
    value: 0.0003
  agent.kwargs.gamma:
    value: 0.997
  agent.kwargs.tau:
    value: 0.005
  agent.kwargs.batch_size:
    value: 256
  agent.kwargs.ent_coef:
    value: "auto"

  train.kwargs.total_timesteps:
    value: 500000

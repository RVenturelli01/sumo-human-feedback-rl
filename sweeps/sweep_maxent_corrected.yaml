program: scripts/test_demo_SAC.py
method: bayes
run_cap: 24

metric:
  name: agent/rewards/ep_fast_return
  goal: maximize

command:
  - python
  - ${program}
  - ${args_no_hyphens}

parameters:
  # Parametri da esplorare
  algo.kwargs.lr_rew:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.0001

  algo.kwargs.temperature:
    values: [5.0, 10.0, 20.0]

  algo.kwargs.gradient_steps_rew:
    values: [5, 10]

  algo.kwargs.l2_rew:
    values: [0.05, 0.1]

  algo.kwargs.batch_size_model:
    values: [128, 256]

  # Parametri fissi
  algo.kwargs.loss_type:
    value: maxent_corrected
  algo.kwargs.batch_size_expert:
    value: 64
  algo.kwargs.relabel_rewards:
    value: true
  algo.kwargs.normalize_agent_reward:
    value: true
  algo.kwargs.initial_agent_timesteps:
    value: 20000
  algo.kwargs.reward_model_kwargs.net_arch:
    value: "[32,32]"
  algo.kwargs.reward_model_kwargs.n_ensembles:
    value: 3
  algo.kwargs.reward_model_kwargs.alpha:
    value: 0.05

  agent.kwargs.ent_coef:
    value: auto
  agent.kwargs.gradient_steps:
    value: 8
  agent.kwargs.train_freq:
    value: 8

  # Screening più corto
  train.kwargs.total_timesteps:
    value: 300000
  train.kwargs.timesteps_per_iteration:
    value: 20000

  run.output_dir:
    value: outputs/maxent_corrected_sweep
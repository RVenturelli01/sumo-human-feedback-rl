# Stage 3 — Network architecture (20-30 trials).
# Fill in the best values from Stages 1 and 2 below before launching.
#
#   wandb sweep sweeps/sweep_arch.yaml
#   wandb agent <entity>/<project>/<sweep_id>

program: scripts/train_sac_baseline.py
method: bayes
# Stop the sweep automatically after this many trials (across all agents).
run_cap: 25
metric:
  name: sweep/mean_fast_return
  goal: maximize

command:
  - python
  - ${program}
  - ${args_no_hyphens}

parameters:
  # --- swept this stage ---
  # Values must contain no spaces so Hydra parses them as a list on the CLI.
  agent.kwargs.policy_kwargs.net_arch:
    values: ["[16,16]", "[32,32]", "[64,64]", "[128,128]", "[256,256]", "[400,300]", "[256,256,256]"]

  # --- BEST FROM STAGES 1 & 2 (edit these) ---
  agent.kwargs.learning_rate:
    value: 0.0003
  agent.kwargs.gamma:
    value: 0.997
  agent.kwargs.tau:
    value: 0.005
  agent.kwargs.batch_size:
    value: 256
  agent.kwargs.ent_coef:
    value: "auto"
  agent.kwargs.buffer_size:
    value: 100000
  agent.kwargs.learning_starts:
    value: 2000
  agent.kwargs.train_freq:
    value: 1
  agent.kwargs.gradient_steps:
    value: 1

  train.kwargs.total_timesteps:
    value: 500000

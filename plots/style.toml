#  ┌──────────────────────────────────────────────────────────────────────────┐
#  │  Plotting rules — edited by hand, no script ever rewrites this file      │
#  └──────────────────────────────────────────────────────────────────────────┘
#
#  It applies to the selector preview and to the .tex export alike: what you see
#  is what you download. The file is reread for every figure, so saving and
#  redrawing is enough. Nothing needs restarting.
#
#  Single-quoted strings are literal, so LaTeX backslashes are written as they
#  are. Inside double quotes they have to be doubled.
#
#  A deleted line falls back to the default in the code. The current defaults are
#  written out below, so it is clear what there is to change.


# ── Figure ────────────────────────────────────────────────────────────────────
[figure]
panel_size = [3.4, 2.5]      # pollici, per pannello (larghezza, altezza)
xlabel = "Environment timesteps"   # learning curves only; budget uses the chosen axis name
ylabel = "Mean return"       # "" = whatever the selected metric says
xscale = 1e6                 # divides the learning-curve x axis (1e6 = millions of steps)
share = "row"                # none | row | col | all: quali pannelli condividono la y
font_scale = 1.0              # moltiplica tutte le dimensioni dei font


# ── Curve ─────────────────────────────────────────────────────────────────────
[lines]
width = 1.4                  # spessore di default (le regole [[series]] lo sovrascrivono)
band_alpha = 0.18            # opacity of the band over seeds
band = "se"                  # se | std | ci95 | iqr | minmax | none
smooth = 5                   # moving-average window, 0 = raw curves
baseline_color = "#000000"
baseline_width = 1.6


# ── Legend ────────────────────────────────────────────────────────────────────
[legend]
# outside_right (default)  outside the axes, on the right: never on top of the
#                          data, and good with many series in one panel
# outside_bottom           outside the axes, below the whole grid
# panel                    inside every panel, at the position in `loc`
# first                    inside the first panel only
# figure                   one legend below the grid (alias of outside_bottom)
# none                     no legend
where = "outside_right"
loc = "best"                 # only used with where = "panel" | "first"
ncol = 1
frame = true
font_size = 8.5


# ── Palette ───────────────────────────────────────────────────────────────────
# Used for series that no [[series]] rule colours, in the order written here.
# One colour per method, so a method keeps the same colour in every figure.
[palette]
colors = [
  "#2a78d6",   # blu          pref_soft
  "#1baf7a",   # verde acqua  pref_bernoulli
  "#eda100",   # giallo       demo_1
  "#008300",   # verde        demo_2
  "#4a3aa7",   # viola        hybrid_demo_1
  "#e34948",   # rosso        hybrid_demo_2
  "#8a4b08",   # marrone      (scorta)
  "#0f7ea6",   # ciano        (scorta)
]


# ── Series ────────────────────────────────────────────────────────────────────
#  One rule per [[series]] block. `match` lists the values a series must have,
#  and the FIRST matching rule wins, so the most specific ones go on top. The
#  keys of `match` are index columns, the same ones the selector filters on.
#
#  Each rule can set:
#    color        colour of the curve or the points
#    width        line width (default: [lines].width)
#    style        solid | dashed | dotted | dashdot
#    band_alpha   band opacity, for this series only
#    name         legend name in the preview, as matplotlib mathtext
#    latex        legend name in the .tex, where LaTeX macros belong
#
#  `name` and `latex` replace only the first part of the label, the method name.
#  What varies between panels stays attached after it.
#
#  The single-source methods are coloured by `arm` directly. The hybrid
#  combinations share the colour of their demo_loss and are told apart by the
#  dash pattern, so they stay readable in greyscale too.

#  ── Schemi di fusione (thesis-grad-diagnostics) ──
#  Stanno PRIMA delle regole per `arm` perche' vince la prima che combacia: gli
#  otto schemi hanno tutti lo stesso arm (hybrid_demo_2), quindi senza queste
#  righe uscirebbero tutti dello stesso colore.
#
#  Fissano solo il colore: il nome in legenda viene da schema.FUSION_NAMES, e
#  ripeterlo qui con `name` lo stamperebbe due volte.
#  Nota: non fissano nemmeno lo `style`, quindi la
#  convenzione "bernoulli = tratteggiato" delle regole per arm qui non si
#  applica. Per confrontare soft e bernoulli mettendo la fusione sui colori,
#  usa `pref_labels` su righe o colonne.

[[series]]
match = { fusion = "norm_balance" }
color = "#333333"

[[series]]
match = { fusion = "alpha_norm_single_adam" }
color = "#eb6834"

[[series]]
match = { fusion = "dual_adam_alpha" }
color = "#1baf7a"

[[series]]
match = { fusion = "dual_adam_sum" }
color = "#eda100"

[[series]]
match = { fusion = "dual_adam_alpha_unit" }
color = "#4a3aa7"

[[series]]
match = { fusion = "dual_adam_alpha_unit_nobudget" }
color = "#0f7ea6"

[[series]]
match = { fusion = "dual_adam_reliability" }
color = "#8A9099"

[[series]]
match = { fusion = "demo_anchor_inv_var" }
color = "#8a4b08"

#  ── Bracci ──

[[series]]
match = { arm = "pref_soft" }
color = "#2a78d6"
style = "solid"
name  = 'pref_soft'
latex = '\prefsoft'

[[series]]
match = { arm = "pref_bernoulli" }
color = "#1baf7a"
style = "solid"
name  = 'pref_bernoulli'
latex = '\prefbern'

[[series]]
match = { arm = "demo_1" }
color = "#eda100"
style = "solid"
name  = 'demo_1'
latex = '\demoone'

[[series]]
match = { arm = "demo_2" }
color = "#008300"
style = "solid"
name  = 'demo_2'
latex = '\demotwo'

[[series]]
match = { arm = "hybrid_demo_1_soft" }
color = "#4a3aa7"
style = "solid"
name  = 'hybrid_demo_1 (soft)'
latex = '\hybridonesoft'

[[series]]
match = { arm = "hybrid_demo_1_bernoulli" }
color = "#4a3aa7"
style = "dashed"
name  = 'hybrid_demo_1 (bernoulli)'
latex = '\hybridonebern'

[[series]]
match = { arm = "hybrid_demo_2_soft" }
color = "#e34948"
style = "solid"
name  = 'hybrid_demo_2 (soft)'
latex = '\hybridtwosoft'

[[series]]
match = { arm = "hybrid_demo_2_bernoulli" }
color = "#e34948"
style = "dashed"
name  = 'hybrid_demo_2 (bernoulli)'
latex = '\hybridtwobern'


# ── .tex only ─────────────────────────────────────────────────────────────────
#  Things matplotlib cannot express, so they do not show in the preview.
[latex]
# Lines added inside \begin{axis}[...] of every panel, after the options
# tikzplotlib writes, so these win.
axis_options = [
  # 'width=\figurewidth',
  # 'height=\figureheight',
  # 'legend style={at={(0.97,0.03)},anchor=south east,draw=lightgray204}',
]

# Header comment of the generated .tex files: a reminder of what the preamble
# needs.
preamble = '\usepackage{pgfplots,amsmath}  \pgfplotsset{compat=1.18}'

# Macros the document has to define for the `latex` names above to work.
# They are a reminder, written as a comment at the top of every exported .tex.
macros = [
  '\newcommand{\prefsoft}{\mathtt{pref\_soft}}',
  '\newcommand{\prefbern}{\mathtt{pref\_bernoulli}}',
  '\newcommand{\demoone}{\mathtt{demo\_1}}',
  '\newcommand{\demotwo}{\mathtt{demo\_2}}',
  '\newcommand{\hybridonesoft}{\mathtt{hybrid\_demo\_1}\ (\mathrm{soft})}',
  '\newcommand{\hybridonebern}{\mathtt{hybrid\_demo\_1}\ (\mathrm{bernoulli})}',
  '\newcommand{\hybridtwosoft}{\mathtt{hybrid\_demo\_2}\ (\mathrm{soft})}',
  '\newcommand{\hybridtwobern}{\mathtt{hybrid\_demo\_2}\ (\mathrm{bernoulli})}',
]

# Conda environment for the experiments.
#
# Versions are pinned to the ones that produced the reference results. Conda
# provides the interpreter only; everything else comes from pip, as in the
# original environment.
#
#   conda env create -f environment.yml
#   conda activate sumo-rlhf
#   pip install -e human-feedback-rl -e sumo-rl-ego
#
# `setup.sh` performs all three steps plus the dataset download.
#
# SUMO comes from pip (libsumo/sumolib/traci). With a system SUMO instead, point
# SUMO_HOME at it and keep the version at 1.27.1: the simulator decides the
# rollouts.
name: sumo-rlhf

channels:
  - conda-forge

dependencies:
  - python=3.12.13
  - pip
  - pip:
      # --- reward learning and RL ---
      # The CPU index, because nothing here uses a GPU. The version is pinned
      # but not the local build tag: the reference runs used 2.13.0+cpu on Linux,
      # while macOS ARM only publishes 2.13.0. Same version, same code path.
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.13.0
      - stable-baselines3==2.9.0
      - gymnasium==1.3.0
      - numpy==2.5.2
      - scipy==1.17.1

      # --- simulator ---
      - libsumo==1.27.1
      - sumolib==1.27.1
      - traci==1.27.1

      # --- configuration and experiment tracking ---
      - hydra-core==1.3.5
      - omegaconf==2.3.1
      - wandb==0.28.2

      # --- figures, tables and datasets ---
      # pandas and pyarrow are required by the plotting toolkit: plots/ imports
      # pandas in nine modules, and plots/requirements.txt assumes pandas,
      # matplotlib and wandb are already present. Install the rest with
      #   pip install -r plots/requirements.txt
      - matplotlib==3.11.1
      - pandas==3.0.5
      # libsumo warns that it was compiled against libarrow2400. The runs finish
      # regardless, and this pairing is the one that produced the results.
      - pyarrow==25.0.1
      - huggingface-hub==1.27.0

      # --- tests ---
      - pytest==9.1.1

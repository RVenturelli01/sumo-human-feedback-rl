# Conda environment for the thesis experiments.
#
# Versions are pinned to those that produced the results reported in the thesis
# (campaigns th_1mh4_* and th_1mh4iq5_*, W&B project `thesis-final`). Conda
# provides the interpreter only; everything else comes from pip, which is what
# the original environment used.
#
#   conda env create -f environment.yml
#   conda activate sumo-rlhf
#   pip install -e human-feedback-rl -e sumo-rl-ego
#
# `setup.sh` performs all three steps plus the dataset download.
#
# SUMO itself is installed through pip (libsumo/sumolib/traci). If you use a
# system SUMO instead, make sure SUMO_HOME points at it and that the version
# matches 1.27.1 — the simulator version affects the rollouts.
name: sumo-rlhf

channels:
  - conda-forge

dependencies:
  - python=3.12.13
  - pip
  - pip:
      # --- reward learning and RL ---
      # The experiments ran the CPU build. Pinning the exact artefact needs the
      # PyTorch CPU index; drop both lines and use a plain `torch==2.13.0` if you
      # want a GPU build (nothing here requires one).
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.13.0+cpu
      - stable-baselines3==2.9.0
      - gymnasium==1.3.0
      - numpy==2.5.2
      - scipy==1.17.1

      # --- simulator ---
      - libsumo==1.27.1
      - sumolib==1.27.1
      - traci==1.27.1

      # --- configuration and experiment tracking ---
      - hydra-core==1.3.5
      - omegaconf==2.3.1
      - wandb==0.28.2

      # --- figures, tables and datasets ---
      # pandas and pyarrow are required by the plotting toolkit: plots/ imports
      # pandas in nine modules, and plots/requirements.txt assumes pandas,
      # matplotlib and wandb are already present. Install the rest with
      #   pip install -r plots/requirements.txt
      - matplotlib==3.11.1
      - pandas==3.0.5
      - pyarrow==25.0.1
      - huggingface-hub==1.27.0

      # --- tests ---
      - pytest==9.1.1

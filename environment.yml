# Conda environment for the thesis experiments.
#
# Versions are pinned to those that produced the results reported in the thesis
# (campaigns th_1mh4_* and th_1mh4iq5_*, W&B project `thesis-final`). Conda
# provides the interpreter only; everything else comes from pip, which is what
# the original environment used.
#
#   conda env create -f environment.yml
#   conda activate sumo-rlhf
#   pip install -e human-feedback-rl -e sumo-rl-ego
#
# `setup.sh` performs all three steps plus the dataset download.
#
# SUMO itself is installed through pip (libsumo/sumolib/traci). If you use a
# system SUMO instead, make sure SUMO_HOME points at it and that the version
# matches 1.27.1 — the simulator version affects the rollouts.
name: sumo-rlhf

channels:
  - conda-forge

dependencies:
  - python=3.12.13
  - pip
  - pip:
      # --- reward learning and RL ---
      # torch is the CPU build in the original environment (2.13.0+cpu); the
      # plain wheel is equivalent for these experiments, which never use a GPU.
      - torch==2.13.0
      - stable-baselines3==2.9.0
      - gymnasium==1.3.0
      - numpy==2.5.2
      - scipy==1.17.1

      # --- simulator ---
      - libsumo==1.27.1
      - sumolib==1.27.1
      - traci==1.27.1

      # --- configuration and experiment tracking ---
      - hydra-core==1.3.5
      - omegaconf==2.3.1
      - wandb==0.28.2

      # --- figures and datasets ---
      - matplotlib==3.11.1
      - huggingface-hub==1.27.0

      # --- tests ---
      - pytest==9.1.1

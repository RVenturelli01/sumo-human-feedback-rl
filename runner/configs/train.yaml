# The base of the composition:
#
#     this file  <  protocol/  <  arm/  <  command line
#
# It holds what identifies a run and how Hydra should behave. The experimental
# protocol lives in protocol/, the tuned hyperparameters in arm/, and the two
# are required to touch disjoint keys so neither can silently override the
# other; a test enforces it.
#
#     python runner/train.py arm=hybrid_soft budget=1000 run.seed=3
defaults:
  - _self_
  - protocol: standard
  - arm: ???

# Feedback budget. Comparisons, initial comparisons and demonstrations are all
# derived from it below, each using the arm's own share.
budget: ???

run:
  seed: 0
  # Derived from what identifies the run, so it cannot land in the wrong group
  # because a flag was forgotten. evaluate.py reads these names back.
  group: ${campaign}_${arm_name}_B${budget}
  name: ${run.group}-seed${run.seed}
  # make_run_dir appends the run name, so this is just the group.
  output_dir: outputs/runs/${run.group}
  # null = the whole dataset. Subsampling keeps the prefix of one seeded
  # permutation, so smaller budgets are nested inside larger ones.
  n_expert_trajectories: ${hfrl.demo_budget:${uses_demonstrations},${budget}}
  # The same budget counted in transitions instead of trajectories. One expert
  # trajectory is about 175 transitions, so a budget of 500 gives the
  # demonstration channel far more data than the preference one; this makes them
  # comparable per transition. Mutually exclusive with n_expert_trajectories.
  n_expert_transitions: null
  # Deliberately independent of run.seed: every arm must read the same
  # demonstrations at the same budget, or a budget curve compares algorithms and
  # demonstration sets at once. Override only for an ablation that varies them
  # on purpose.
  demo_subsample_seed: 1000

wandb:
  # Point these at your own account; WANDB_MODE=offline logs nowhere.
  entity: null
  project: reward-learning
  tags: ["${campaign}", "${arm_name}", "B${budget}"]

env:
  id: "HighwayEgo-v0"

agent:
  kwargs:
    policy: "MlpPolicy"

algo:
  kwargs:
    # Read by demo_only, which does not set them: it has no preference channel,
    # but the oracle is built either way. Every other arm overrides both.
    labels_type: "soft"
    pref_temperature: 20.0

    total_queries: ${hfrl.total_queries:${uses_preferences},${budget}}
    initial_queries: ${hfrl.initial_queries:${uses_preferences},${initial_queries_frac},${budget},${initial_queries_min}}

    # Constants no arm and no protocol changes.
    comparison_queue_size: 1000000
    max_balance_scale: 100.0
    balance_eps: 1e-8
    alpha_eps: 1e-8            # numerical floor of CV^2 = S / ||g_mean||^2
    exploration_eps: 0.5
    reward_model_kwargs:
      alpha: 1
    # Only read when demo_mode=preferences, the Ibarz-style baseline.
    demo_pref_pairs_per_iteration: 64
    demo_pref_batch_fraction: 0.5

# Deterministic episodes on a fresh environment. Seed 1000 is disjoint from the
# training seeds, so evaluation scenarios never coincide with training ones.
eval:
  seed: 1000

hydra:
  job:
    # Do not chdir into a per-run directory: the code writes where run.output_dir
    # says, and a changing working directory would break every relative path.
    chdir: false
  run:
    dir: .
  sweep:
    # --multirun writes its bookkeeping somewhere; send it under outputs/, which
    # is already ignored, instead of leaving a multirun/ tree in the root.
    dir: outputs/multirun
    subdir: ${hydra.job.num}
  output_subdir: null

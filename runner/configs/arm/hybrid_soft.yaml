# @package _global_
#
# Arm `hybrid_soft`. Hyperparameters only; anything shared lives in protocol/.

arm_name: hybrid_soft
uses_preferences: true
uses_demonstrations: true
# alpha is not estimable below 5 comparisons; the norm-balanced
# ablations use the same floor so both collect feedback alike.
initial_queries_min: 5
initial_queries_frac: 0.1

algo:
  kwargs:
    batch_size_expert: 64
    batch_size_pref: 256
    demo_weight: 1.0
    gcl_fusion: alpha_norm_single_adam
    gradient_steps_rew: 139
    initial_agent_timesteps: 20000
    l2_rew: 1.1265276323434602e-06
    label_smoothing: 0.0
    labels_type: soft
    lr_rew: 0.001154295698198038
    normalize_agent_reward: false
    pref_temperature: 20.0
    reward_model_kwargs:
      net_arch: [64, 64]

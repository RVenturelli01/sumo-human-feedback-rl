# @package _global_
#
# Settings shared by every method. An arm must never redefine one of these.

# Goes into the run group, so campaigns stay apart in W&B.
campaign: main

agent:
  kwargs:
    batch_size: 256
    buffer_size: 300000
    device: cpu
    ent_coef: auto
    gamma: 0.995
    gradient_steps: 32
    learning_rate: 0.0001242983309370202
    learning_starts: 2000
    policy_kwargs:
      net_arch: [64, 64]
    tau: 0.005
    train_freq: 4
algo:
  kwargs:
    agent_log_timestep_interval: 10000
    batch_size_model: 64
    bootstrap_comparisons: false
    demo_mode: gcl
    exploration_frac: 0.0
    fragmenter_type: random
    loss_type: demo_2
    preference_fragment_length: 1
    query_schedule: hyperbolic
    relabel_rewards: true
    reward_model_kwargs:
      activation_fn: tanh
      n_ensembles: 1
env:
  kwargs:
    ego: continuous
    reward: fast
  n_envs: 4
  shared_rollout_env: true
eval:
  n_episodes: 20
train:
  kwargs:
    checkpoint_interval: 1000000
    log_interval: 100
    scatter_interval: 0
    timesteps_per_iteration: 20000
    total_timesteps: 1000000

# Base configuration. Everything here is a default that a protocol or an arm may
# override; the composition order is
#
#     this file  <  protocol/  <  arm/  <  command line
#
# so a protocol never silently loses to an arm and vice versa: the two groups are
# required to touch disjoint leaf keys, and tests/test_budget_resolution.py fails
# if they ever overlap.
#
#     python experiments/train.py arm=hybrid_soft protocol=thesis budget=1000 run.seed=3
defaults:
  - _self_
  - protocol: thesis
  - arm: ???

# Feedback budget B. The three quantities it determines -- how many comparisons
# the arm may ask for, how many of them are collected up front, and how many
# demonstrations it reads -- are resolved from it below, using the arm's own
# share. Setting them by hand is what used to go wrong.
budget: ???

run:
  seed: 0
  output_dir: Null
  # Optional readable W&B identity; null falls back to sac_hybrid_<loss_type>.
  name: null
  group: null
  # Demo budget: null = full dataset. Subsampling keeps the prefix of one
  # seeded permutation, so smaller budgets are nested inside larger ones.
  n_expert_trajectories: ${hfrl.demo_budget:${uses_demonstrations},${budget}}
  # Alternative demo budget, counted in TRANSITIONS instead of trajectories:
  # whole trajectories are taken from the same seeded permutation while the
  # cumulative length stays within the cap. One expert trajectory is ~175
  # transitions, so "500 preferences + 500 trajectories" actually gives the
  # demo channel ~175x more data than the preference one; this makes the two
  # channels comparable per transition. Mutually exclusive with
  # n_expert_trajectories.
  n_expert_transitions: null
  # Seed of the demonstration subsample. Deliberately INDEPENDENT of run.seed:
  # the demo-only and hybrid arms must read the same demonstrations at the same
  # budget, otherwise a budget curve compares algorithms and demo sets at once.
  # null falls back to the same shared constant (human_feedback_rl.common
  # .demo_subsampling.DEMO_SUBSAMPLE_SEED). Override only for an ablation that
  # deliberately varies which demonstrations are drawn.
  demo_subsample_seed: 1000

wandb:
  entity: Null
  project: Null
  tags: Null

env:
  id: "HighwayEgo-v0"
  n_envs: 4
  # false (default): le traiettorie per il feedback vengono da un ambiente
  # dedicato, con seed disgiunto. Costa il doppio delle interazioni, ma sono
  # campioni di UNA politica, perche' il rollout gira a pesi fermi.
  # true: si riusa l'ambiente di training. Le transizioni che l'agente produce
  # allenandosi diventano il pool da cui l'oracolo pesca. Meta' interazioni, ma
  # le traiettorie sono una miscela di politiche, perche' i pesi cambiano
  # durante i timestep di learn().
  shared_rollout_env: false
  kwargs:
    ego: "continuous"
    reward: "fast"

agent:
  kwargs:
    policy: "MlpPolicy"
    buffer_size: 100000
    learning_starts: 2000
    batch_size: 256
    learning_rate: 0.0003
    gamma: 0.997
    tau: 0.005
    ent_coef: "auto"
    train_freq: 8
    gradient_steps: 64
    policy_kwargs:
      net_arch: [64, 64]
    device: "cpu"

algo:
  kwargs:
    # How demonstrations enter the reward model:
    #   gcl         -> demo IRL loss + BT preference loss on the shared net
    #   preferences -> demos become expert>agent preference pairs (Ibarz 2018 baseline)
    demo_mode: "gcl"
    # Demo side: demo_1 (difference of means) | demo_2 (MaxEnt surrogate).
    loss_type: demo_2
    # Preference side.
    labels_type: "soft"
    # Oracle label softness. 20 is the validated Christiano recipe.
    pref_temperature: 20.0
    fragmenter_type: "active"
    preference_fragment_length: 1
    batch_size_pref: 128
    comparison_queue_size: 1000000
    total_queries: ${hfrl.total_queries:${uses_preferences},${budget}}
    initial_queries: ${hfrl.initial_queries:${uses_preferences},${initial_queries_frac},${budget},${initial_queries_min}}
    query_schedule: "constant"
    # Gradient balancing: effective demo gradient ~= demo_weight * BT gradient.
    demo_weight: 1.0
    max_balance_scale: 100.0
    balance_eps: 1e-8
    # Come i due gradienti diventano un update.
    #   norm_balance            somma bilanciata di norma (ricetta storica)
    #   alpha_norm_single_adam  direzioni unitarie pesate da alpha, un solo Adam
    gcl_fusion: norm_balance
    # Pavimento numerico di CV^2 = S / ||g_medio||^2.
    alpha_eps: 1e-8
    # Sposta le etichette verso 1/2. Applicato SOLO alle etichette
    # bernoulliane: quelle soft hanno gia' un ottimo finito.
    label_smoothing: 0.0
    bootstrap_comparisons: null   # null = decide n_ensembles
    # demos-as-preferences baseline (demo_mode=preferences only).
    demo_pref_pairs_per_iteration: 64
    demo_pref_batch_fraction: 0.5
    # Shared reward model / SAC reward handling.
    relabel_rewards: false
    normalize_agent_reward: false
    lr_rew: 0.0003
    gradient_steps_rew: 300
    batch_size_expert: 64
    batch_size_model: 64
    # DO NOT raise back to 0.01: Adam weight decay at 1e-2 is ~2x the BT
    # gradient and collapses the reward net (pref branch dies, BT loss pinned
    # at ln2, pred<->true corr ~0). Diagnosed and validated on 2026-07-05.
    l2_rew: 0.0001
    initial_agent_timesteps: 10000
    exploration_frac: 0.0
    exploration_eps: 0.5
    agent_log_timestep_interval: 10000
    reward_model_kwargs:
      n_ensembles: 3
      net_arch: [128, 128]
      activation_fn: tanh
      alpha: 1

# Final held-out evaluation: deterministic episodes on a fresh env, same
# convention as train_sac_baseline (seed 1000 is disjoint from training seeds).
eval:
  n_episodes: 20
  seed: 1000

train:
  kwargs:
    total_timesteps: 2000000
    timesteps_per_iteration: 10000
    log_interval: 100
    checkpoint_interval: 10
    scatter_interval: null
    # NB: il budget di query NON sta qui. Vive fra i kwargs dell'algoritmo
    # (algo.kwargs.total_queries), insieme a initial_queries e query_schedule.
    # Averlo in due posti significava che quello di train() vinceva in
    # silenzio, e nessuno si accorgeva di aver impostato solo l'altro.

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null

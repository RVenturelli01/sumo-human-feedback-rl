# @package _global_
#
# The B=10 variant (W&B groups th_1mh4iq5_*): same protocol, but the
# two-channel methods collect five initial comparisons instead of one.
#
# The reliability-weighted hybrids need them because below
# ALPHA_MIN_PREFS = 5 the weight cannot be estimated at all. The
# norm-balanced ablations do not estimate a weight; they use the same floor
# so both variants collect feedback on the same schedule, which is what
# makes the ablation a comparison of the combination rule alone.
#
# train.py refuses this protocol outside B=10 and on single-channel arms.

defaults:
  - thesis

campaign: 1mh4iq5
initial_queries_min: 5

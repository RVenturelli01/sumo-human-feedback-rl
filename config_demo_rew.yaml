
run:
  seed: 0
  output_dir: "./outputs"
  baseline: false

env:
  id: "HighwayEgo-v0"
  n_envs: 4
  kwargs:
    ego: "continuous"
    reward: "fast"

agent:
  kwargs:
    policy: "MlpPolicy"
    n_steps: 1000
    n_epochs: 10
    learning_rate: 0.0003
    batch_size: 64
    ent_coef: 0.01
    gae_lambda: 0.95
    gamma: 0.995
    policy_kwargs:
      net_arch: [64, 64]
    device: "cpu"
    seed: 0

expert:
  path: null  # path to a saved SB3 PPO model

algo:
  kwargs:
    lr_rew: 0.001
    n_epochs_rew: 5
    batch_size_rew: 100
    l2_rew: 0.01
    decay_rew: 0.0
    fragment_length: 1
    transition_oversampling: 3
    initial_comparisons: 0
    initial_epoch_multiplier: 2
    query_schedule: "constant"
    comparison_queue_size: 1000000
    n_ensembles_rew: 2
    train_comparison_frac: 0.7
    net_arch_rew: [128, 128]

train:
  kwargs:
    total_timesteps: 1000000
    comparisons_per_iteration: 500
    timesteps_per_iteration: 20000
    checkpoint_interval: 10

hydra:
  job:
    chdir: false
  run:
    dir: ${run.output_dir}/${now:%Y-%m-%d_%H-%M-%S}
